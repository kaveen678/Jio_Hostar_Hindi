<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZoroX TV</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Loading Screen Style */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f0f0f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .brand-name {
            font-size: 3.5rem;
            font-weight: bold;
            color: #ff4500;
            text-shadow: 0 0 15px rgba(255, 69, 0, 0.7);
            margin-bottom: 20px;
        }

        /* Video Frame Style */
        #video-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: none; /* මුලින් හංගලා තියෙන්නේ */
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="brand-name">ZoroX</div>
        <div style="color: white; letter-spacing: 2px;">LOADING...</div>
    </div>

    <iframe id="video-frame" 
            src="https://allrounderlive.pages.dev/p6?url=https://dillzyserver.dillzycreations.workers.dev/live/hotstar.m3u8" 
            allowfullscreen>
    </iframe>

    <script>
        window.onload = function() {
            // තත්පර 4කට පසු ලෝඩින් ස්ක්‍රීන් එක අයින් කර වීඩියෝව පෙන්වන්න
            setTimeout(function() {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('video-frame').style.display = 'block';
            }, 4000);
        };
    </script>

</body>
</html>
