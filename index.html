<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZoroX - Loading</title>
    <style>
        /* Loading screen එකේ පෙනුම */
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f0f; /* කළු පැහැති පසුබිමක් */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .loader-container {
            text-align: center;
        }

        .brand-name {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 5px;
            color: #ff4500; /* ZoroX සඳහා තැඹිලි/රතු පැහැයක් */
            text-shadow: 0 0 20px rgba(255, 69, 0, 0.5);
        }

        .loading-text {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        /* Loading පටිත්ත (Progress bar) */
        .progress-bar {
            width: 200px;
            height: 4px;
            background: #333;
            margin-top: 20px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #ff4500;
            animation: loading 3s forwards;
        }

        @keyframes loading {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="loader-container">
        <div class="brand-name">ZoroX</div>
        <div class="loading-text">INITIALIZING...</div>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
    </div>

    <script>
        // තත්පර 3කට පසු ඔබේ URL එකට redirect කිරීම
        setTimeout(function() {
            window.location.href = "https://allrounderlive.pages.dev/p6?url=https://dillzyserver.dillzycreations.workers.dev/live/hotstar.m3u8";
        }, 3500); // 3500ms කියන්නේ තත්පර 3.5ක්
    </script>

</body>
</html>
